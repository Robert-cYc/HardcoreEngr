  <script>
    // 載入 tech-news.json（fetch 優先，file:// 退回 XHR）
    (function () {
      var content = document.getElementById('news-content');
      var updated = document.getElementById('news-updated');

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function render(data) {
        if (data.updated) {
          updated.textContent = '資料更新時間：' + data.updated;
          updated.hidden = false;
        }

        var html = '';
        (data.sources || []).forEach(function (src) {
          html += '<section class="news-section">'
            + '<div class="news-section-head">'
            + '<h2>' + escapeHtml(src.name) + '</h2>'
            + '<a href="' + escapeHtml(src.site) + '" target="_blank" rel="noopener">前往來源網站 →</a>'
            + '</div>';

          if (src.error && !src.items.length) {
            html += '<p class="news-source-error">此來源暫時抓不到資料，稍後再試。</p>';
          } else {
            html += '<ul class="news-list">';
            src.items.forEach(function (item) {
              html += '<li class="news-item">'
                + '<div class="news-item-title"><a href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener">'
                + escapeHtml(item.title) + '</a></div>'
                + (item.summary ? '<p class="news-item-summary">' + escapeHtml(item.summary) + '…</p>' : '')
                + '<span class="news-item-date">' + escapeHtml(item.date) + '</span>'
                + '</li>';
            });
            html += '</ul>';
          }
          html += '</section>';
        });

        content.innerHTML = html || '<div class="news-status">目前沒有新聞資料。</div>';
      }

      function fail() {
        content.innerHTML = '<div class="news-status">還沒有新聞資料。<br>'
          + '在專案根目錄執行 <code>python3 scripts/fetch_news.py</code> 生成 <code>tech-news.json</code> 後重新整理。</div>';
      }

      function load(url) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onload = function () {
          if (xhr.status === 200) {
            try { render(JSON.parse(xhr.responseText)); return; } catch (e) { /* fall through */ }
          }
          fail();
        };
        xhr.onerror = fail;
        xhr.send();
      }

      if (location.protocol === 'file:') {
        load('./tech-news.json');
      } else {
        fetch('./tech-news.json')
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(render)
          .catch(function () { load('./tech-news.json'); });
      }
    })();
  </script>
